  <text x="1110" y="287" text-anchor="middle" font-size="11.5" fill="#0369a1">Snowpipe · X-Small WH</text>

  <line x1="940" y1="235" x2="1010" y2="235" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>

