  <text x="1110" y="475" text-anchor="middle" font-size="12" fill="#b91c1c">slim CI on PRs</text>

  <path d="M1085 318 v42" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M1135 360 v-42" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="1176" y="343" font-size="10.5" fill="#64748b">transform</text>

