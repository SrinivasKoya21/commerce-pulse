  <text x="1355" y="226" text-anchor="middle" font-size="12" fill="#047857">Revenue trends</text>
  <text x="1355" y="246" text-anchor="middle" font-size="12" fill="#047857">Funnel conversion</text>
  <text x="1355" y="266" text-anchor="middle" font-size="12" fill="#047857">Sentiment vs revenue</text>
  <text x="1355" y="286" text-anchor="middle" font-size="12" fill="#047857">ML segments</text>

  <line x1="1210" y1="235" x2="1270" y2="235" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>

  <!-- CI/CD bar -->
  <rect x="40" y="610" width="1400" height="110" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="70" y="646" font-size="15" font-weight="700" fill="#334155">CI/CD — GitHub Actions</text>
  <text x="70" y="676" font-size="12.5" fill="#475569">• ruff lint + pytest (local SparkSession) on every PR      • dbt slim CI — build only changed models into a PR schema</text>
  <text x="70" y="700" font-size="12.5" fill="#475569">• Databricks Asset Bundle validate + deploy on merge to main      • secrets in GitHub environments / Databricks secret scopes</text>

  <text x="1280" y="690" font-size="11.5" fill="#94a3b8">github.com/&lt;you&gt;/commerce-pulse</text>
